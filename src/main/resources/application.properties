spring.application.name=spring-lab-01
server.port=8080
app.owner=Bolatbai Nursultan, IT1-2405IS
logging.level.web=INFO
app.date-pattern=yyyy-MM-dd HH:mm:ss
spring.messages.encoding=UTF-8
spring.messages.basename=messages

spring.datasource.url=jdbc:postgresql://localhost:5432/springlab
spring.datasource.username=springlab
spring.datasource.password=springlab

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
