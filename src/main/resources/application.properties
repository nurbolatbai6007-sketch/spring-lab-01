spring.application.name=spring-lab-01

server.port=8080

app.owner=Bolatbai Nursultan, IT1-2405IS

logging.level.web=INFO

app.date-pattern=yyyy-MM-dd HH:mm:ss

# Messages / i18n
spring.messages.encoding=UTF-8
spring.messages.basename=messages
# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/springlab
spring.datasource.username=springlab
spring.datasource.password=springlab

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false