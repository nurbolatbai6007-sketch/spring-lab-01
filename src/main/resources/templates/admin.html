<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<h1>Administration</h1>

<p>
    Logged in as: <strong sec:authentication="name">anonymous</strong>
    &mdash; roles:
    <span sec:authentication="principal.authorities">[ROLE_ANONYMOUS]</span>
</p>

<h2>Users</h2>
<table>
    <thead>
    <tr>
        <th>#</th>
        <th>Username</th>
        <th>Enabled</th>
        <th>Roles</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.username}">user</td>
        <td th:text="${u.enabled}">true</td>
        <td th:text="${u.roles}">[USER]</td>
    </tr>
    </tbody>
</table>

<p><a th:href="@{/books}">← Back to catalogue</a></p>
</body>
</html>
